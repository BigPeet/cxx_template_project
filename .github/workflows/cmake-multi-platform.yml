name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/cmake-multi-platform.yml'
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'cmake/**'
      - '.clang-format'
      - '.clang-tidy'
      - 'CMakeLists.txt'
      - 'Makefile'
  pull_request:
    branches: [ "master" ]
    paths:
      - '.github/workflows/cmake-multi-platform.yml'
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'cmake/**'
      - '.clang-format'
      - '.clang-tidy'
      - 'CMakeLists.txt'
      - 'Makefile'

jobs:
  format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        shell: bash
        run: sudo apt update && sudo apt install clang-format-18
      - name: Apply clang-format
        shell: bash
        run: make check-format

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        shell: bash
        run: sudo apt update && sudo apt install clang-tidy-18
      - name: Apply clang-tidy
        shell: bash
        run: make lint

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=$GITHUB_WORKSPACE/build" >> "$GITHUB_OUTPUT"
        echo "install-dir=$GITHUB_WORKSPACE/bin" >> "$GITHUB_OUTPUT"
        echo "app-binary=cxx_template_project" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      shell: bash
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          ENABLE_SANITIZERS=OFF # Windows sanitizers don't work well on CI :-/
        else
          ENABLE_SANITIZERS=ON
        fi
        cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
        -S "$GITHUB_WORKSPACE" \
        -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" \
        -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" \
        -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
        -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE" \
        -DDEV_MODE=ON \
        -DENABLE_SANITIZERS="$ENABLE_SANITIZERS"

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Install
      run: cmake --install ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Dummy Run Test
      working-directory: ${{ steps.strings.outputs.install-dir }}
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          ./${{ steps.strings.outputs.app-binary }}.exe
        else
          ./${{ steps.strings.outputs.app-binary }}
        fi

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.strings.outputs.app-binary }}-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
        path: ${{ steps.strings.outputs.install-dir }}/${{ steps.strings.outputs.app-binary }}*
        retention-days: 14

